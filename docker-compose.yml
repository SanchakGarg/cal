services:
  postgres:
    image: postgres:16
    container_name: cal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cal
      POSTGRES_PASSWORD: cal
      POSTGRES_DB: cal
    ports:
      - "5432:5432"
    volumes:
      - cal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cal -d cal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Full self-hosted app: API plus the built web bundle on one port.
  # `docker compose up -d` starts this and postgres together; the container
  # applies migrations before it serves.
  app:
    build: .
    container_name: cal-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://cal:cal@postgres:5432/cal
      SERVE_WEB: "true"
      API_PORT: "3001"
      # Pinned here because `environment` outranks `env_file`: a NODE_ENV meant
      # for local dev in .env must not put the container into development mode.
      NODE_ENV: "production"
      # Set to "true" to load the demo users, team and bookings on start.
      # The seed is idempotent, so it is safe to leave on for a demo instance.
      SEED_ON_START: "${SEED_ON_START:-false}"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cal-pgdata:
