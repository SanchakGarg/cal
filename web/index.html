<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cal — scheduling</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so there is no light flash, and outside
      // React so the pages that render without the app shell (login, booker,
      // booking confirmation) are themed too. Dark is the default; an explicit
      // choice in localStorage wins.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("cal.theme");
        } catch (error) {
          // Private browsing can make localStorage throw on read.
        }
        var theme = stored || "dark";
        if (theme === "system") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
